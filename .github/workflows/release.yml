name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ensures the tag version matches the ASDF version recorded in the tagged
      # source tree, so the release tag and package metadata agree.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-org-kit
        run: |
          set -euo pipefail
          asd_version="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd" | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      # Creates an empty draft without reading CHANGELOG.md. After this job
      # goes green, the maintainer copies the matching version section into the
      # draft, reviews it, and publishes. See RELEASE_STANDARD.md.
      #
      # `draft: true` is load-bearing. Publishing straight away would make "the
      # maintainer forgot the notes" a user-visible state. A draft appears
      # neither under "Latest release" nor in the default output of
      # `gh release list`. See RELEASE_STANDARD.md for the separate notes
      # review and publication steps.
      #
      # `generate_release_notes` is deliberately left off. Generated notes are a
      # list of commit titles and PR numbers, and RELEASE_STANDARD.md requires
      # the notes to be selected by "does a user of this package have to change
      # their own code" -- a judgement no generator can make.
      #
      # External GitHub Actions are pinned to commit SHAs. Verify the upstream
      # tag before changing a pin; do not copy a SHA without resolving it.
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
